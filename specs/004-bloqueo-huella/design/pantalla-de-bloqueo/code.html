<!doctype html>

<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta content="mobile_blank" name="shell-type" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-secondary-fixed': '#2a1700',
              background: '#fcf8ff',
              'surface-container-highest': '#e3dfff',
              'on-tertiary-fixed-variant': '#005236',
              'on-primary-fixed': '#07006c',
              'primary-fixed-dim': '#c0c1ff',
              'on-primary': '#ffffff',
              'tertiary-fixed-dim': '#4edea3',
              'surface-container': '#efebff',
              'on-surface': '#181445',
              tertiary: '#006c49',
              'on-secondary': '#ffffff',
              'on-error': '#ffffff',
              'on-primary-container': '#fffbff',
              error: '#ba1a1a',
              'on-secondary-container': '#684000',
              'tertiary-fixed': '#6ffbbe',
              'secondary-container': '#fea619',
              primary: '#4648d4',
              secondary: '#855300',
              'on-secondary-fixed-variant': '#653e00',
              outline: '#767586',
              'inverse-surface': '#2d2a5b',
              'surface-container-low': '#f6f2ff',
              'on-background': '#181445',
              'surface-variant': '#e3dfff',
              'surface-bright': '#fcf8ff',
              'tertiary-container': '#00885d',
              'surface-dim': '#dad6ff',
              'on-tertiary-fixed': '#002113',
              'inverse-primary': '#c0c1ff',
              'primary-container': '#6063ee',
              'error-container': '#ffdad6',
              'on-error-container': '#93000a',
              'inverse-on-surface': '#f3eeff',
              'outline-variant': '#c7c4d7',
              'on-surface-variant': '#464554',
              'primary-fixed': '#e1e0ff',
              surface: '#fcf8ff',
              'secondary-fixed-dim': '#ffb95f',
              'surface-tint': '#494bd6',
              'secondary-fixed': '#ffddb8',
              'on-tertiary-container': '#000703',
              'on-primary-fixed-variant': '#2f2ebe',
              'surface-container-high': '#e9e5ff',
              'surface-container-lowest': '#ffffff',
              'on-tertiary': '#ffffff',
            },
            borderRadius: { DEFAULT: '1rem', lg: '2rem', xl: '3rem', full: '9999px' },
            spacing: {
              'space-md': '1rem',
              gutter: '1rem',
              margin: '1.25rem',
              'space-sm': '0.5rem',
              'space-lg': '1.5rem',
              'space-xs': '0.25rem',
              'space-xl': '2.25rem',
            },
            fontFamily: {
              'headline-lg': ['Plus Jakarta Sans'],
              'body-lg': ['Plus Jakarta Sans'],
              'display-lg': ['Plus Jakarta Sans'],
              'headline-md': ['Plus Jakarta Sans'],
              'body-md': ['Plus Jakarta Sans'],
              'body-sm': ['Plus Jakarta Sans'],
              'label-sm': ['Plus Jakarta Sans'],
              'label-lg': ['Plus Jakarta Sans'],
              'label-md': ['Plus Jakarta Sans'],
              'headline-sm': ['Plus Jakarta Sans'],
            },
            fontSize: {
              'headline-lg': [
                '28px',
                { lineHeight: '36px', letterSpacing: '-0.02em', fontWeight: '700' },
              ],
              'body-lg': ['16px', { lineHeight: '24px', fontWeight: '500' }],
              'display-lg': [
                '36px',
                { lineHeight: '44px', letterSpacing: '-0.03em', fontWeight: '800' },
              ],
              'headline-md': [
                '22px',
                { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '700' },
              ],
              'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
              'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }],
              'label-sm': [
                '10px',
                { lineHeight: '14px', letterSpacing: '0.04em', fontWeight: '700' },
              ],
              'label-lg': [
                '14px',
                { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '700' },
              ],
              'label-md': [
                '12px',
                { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' },
              ],
              'headline-sm': ['18px', { lineHeight: '24px', fontWeight: '600' }],
            },
          },
        },
      };
    </script>
    <style>
      @layer base {
        html,
        body {
          width: 100vw;
          min-height: 100vh;
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior-y: none;
          -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">
    <main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe">
      <div class="flex flex-col w-full relative select-none">
        <!-- Interactive State Reviewer & Theme Toolbar (Floating, Ergonomic for UX Review) -->
        <aside
          aria-label="Herramientas de revisión de estados UX"
          class="w-full px-space-md pt-2 pb-space-sm bg-surface-container-high/90 backdrop-blur-md rounded-b-2xl shadow-sm z-50"
        >
          <div class="flex items-center justify-between gap-space-xs mb-2">
            <span
              class="flex items-center gap-1.5 font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant"
            >
              <span class="inline-block w-2 h-2 rounded-full bg-tertiary"></span>
              Simulador de Estados Biométricos
            </span>
            <button
              aria-label="Alternar modo visual oscuro y claro"
              class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface text-primary font-label-sm text-label-sm shadow-sm active:scale-95 transition-transform"
              id="theme-toggle-btn"
              type="button"
            >
              <span class="material-symbols-outlined text-[16px]" id="theme-toggle-icon"
                >dark_mode</span
              >
              <span id="theme-toggle-label">Oscuro</span>
            </button>
          </div>
          <!-- State Pills Switcher -->
          <div
            aria-label="Estados del sensor biométrico"
            class="grid grid-cols-2 gap-1.5 sm:flex sm:flex-wrap"
            role="tablist"
          >
            <button
              aria-selected="true"
              class="state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm active:scale-97 transition-all text-center"
              id="tab-state-a"
              onclick="setBiometricState('waiting')"
              role="tab"
              type="button"
            >
              <span class="material-symbols-outlined text-[15px]">sensors</span>
              <span>A: Esperando</span>
            </button>
            <button
              aria-selected="false"
              class="state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-surface text-on-surface-variant shadow-sm active:scale-97 transition-all text-center"
              id="tab-state-b"
              onclick="setBiometricState('canceled')"
              role="tab"
              type="button"
            >
              <span class="material-symbols-outlined text-[15px]">pause_circle</span>
              <span>B: Pausado</span>
            </button>
            <button
              aria-selected="false"
              class="state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-surface text-on-surface-variant shadow-sm active:scale-97 transition-all text-center"
              id="tab-state-c"
              onclick="setBiometricState('unrecognized')"
              role="tab"
              type="button"
            >
              <span class="material-symbols-outlined text-[15px]">error_outline</span>
              <span>C: Reintentar</span>
            </button>
            <button
              aria-selected="false"
              class="state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-surface text-on-surface-variant shadow-sm active:scale-97 transition-all text-center"
              id="tab-state-d"
              onclick="setBiometricState('locked')"
              role="tab"
              type="button"
            >
              <span class="material-symbols-outlined text-[15px]">lock_clock</span>
              <span>D: PIN Requerido</span>
            </button>
          </div>
        </aside>
        <!-- Complete Shield Canvas (100% opaque cover preserving privacy of tasks/streaks) -->
        <section
          aria-label="Escudo biométrico de la aplicación"
          class="w-full flex flex-col justify-between px-margin py-space-lg min-h-[calc(100vh-140px)]"
          id="shield-viewport"
        >
          <!-- Top Warm Status Badges & App Identity -->
          <header class="flex flex-col items-center text-center gap-space-sm pt-space-xs">
            <div
              class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-secondary-fixed text-on-secondary-fixed shadow-sm transition-all duration-300"
              id="streak-protection-pill"
            >
              <span
                class="material-symbols-outlined text-secondary text-[18px]"
                style="font-variation-settings: 'FILL' 1"
                >local_fire_department</span
              >
              <span class="font-label-md text-label-md">Racha de 14 días protegida</span>
            </div>
            <div
              class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-surface-variant"
            >
              <span
                class="material-symbols-outlined text-[16px] text-primary"
                style="font-variation-settings: 'FILL' 1"
                >verified_user</span
              >
              <span class="font-label-sm text-label-sm uppercase tracking-wider"
                >Espacio de hábitos cifrado</span
              >
            </div>
          </header>
          <!-- Sensory Centerpiece: Concentric Luminous Biometric Orb -->
          <main class="flex flex-col items-center justify-center my-auto py-space-md text-center">
            <div
              class="relative flex items-center justify-center w-64 h-64 mb-space-md"
              id="biometric-orb-parent"
            >
              <!-- Outer Soft Ambient Ripple 2 -->
              <div
                class="absolute inset-0 rounded-full bg-primary-fixed opacity-40 animate-ping transition-all duration-700 pointer-events-none"
                id="ring-outer"
                style="animation-duration: 3s"
              ></div>
              <!-- Middle Harmonic Ripple 1 -->
              <div
                class="absolute inset-4 rounded-full bg-surface-container-highest opacity-70 transition-all duration-500 pointer-events-none"
                id="ring-mid"
              ></div>
              <!-- Inner Tactile Touch Orb (Interactive thumb hit target) -->
              <button
                aria-label="Sensor táctil de huella dactilar. Toca para verificar identidad."
                class="relative z-10 flex flex-col items-center justify-center w-40 h-40 rounded-full bg-primary text-on-primary shadow-xl active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-primary-fixed"
                id="biometric-touch-target"
                onclick="handleOrbTap()"
                type="button"
              >
                <!-- Floating XP micro-burst hint -->
                <div
                  class="absolute -top-1 px-2.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm shadow-sm flex items-center gap-1"
                  id="orb-badge"
                >
                  <span
                    class="material-symbols-outlined text-[13px]"
                    style="font-variation-settings: 'FILL' 1"
                    >auto_awesome</span
                  >
                  <span>+25 XP listos</span>
                </div>
                <!-- Dynamic Sensory Icon -->
                <span
                  class="material-symbols-outlined text-[64px] transition-transform duration-300"
                  id="orb-icon"
                  style="font-variation-settings: 'FILL' 1"
                  >fingerprint</span
                >
                <span class="font-label-sm text-label-sm text-on-primary/80 mt-1" id="orb-sublabel">
                  Toca el sensor
                </span>
              </button>
            </div>
            <!-- Live Messaging & Feedback Announcement -->
            <div
              aria-live="assertive"
              class="flex flex-col items-center max-w-xs transition-all duration-300 px-space-xs"
              id="status-announcer"
              role="status"
            >
              <h2
                class="font-headline-md text-headline-md text-on-surface mb-1"
                id="feedback-title"
              >
                Huella dactilar activa
              </h2>
              <p
                class="font-body-md text-body-md text-on-surface-variant text-center leading-relaxed"
                id="feedback-desc"
              >
                Toca el sensor de huella de tu móvil para continuar construyendo tus hábitos hoy.
              </p>
            </div>
          </main>
          <!-- Bottom Thumb Zone Actions (Optimized for one-handed ergonomic reach) -->
          <footer
            class="flex flex-col gap-space-sm pt-space-xs pb-space-sm w-full max-w-sm mx-auto"
          >
            <!-- Main Trigger / Biometric Launcher -->
            <button
              class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-97 transition-all duration-200"
              id="primary-action-btn"
              onclick="handleOrbTap()"
              type="button"
            >
              <span
                class="material-symbols-outlined text-[20px]"
                id="primary-action-icon"
                style="font-variation-settings: 'FILL' 1"
                >fingerprint</span
              >
              <span id="primary-action-text">Desbloquear con huella</span>
            </button>
            <!-- Alternative Access (System PIN/Pattern Fallback) -->
            <button
              class="w-full h-11 rounded-full bg-surface-container text-primary font-label-md text-label-md flex items-center justify-center gap-2 active:scale-97 transition-all duration-200"
              id="secondary-action-btn"
              onclick="triggerSystemFallback()"
              type="button"
            >
              <span class="material-symbols-outlined text-[18px]">dialpad</span>
              <span id="secondary-action-text">Usar PIN o patrón del sistema</span>
            </button>
            <!-- Reassuring Security Privacy Microcopy -->
            <p class="font-body-sm text-body-sm text-outline text-center mt-1">
              Tus tareas personales y métricas permanecen encriptadas localmente.
            </p>
          </footer>
        </section>
      </div>
      <script>
        // State machine configurations for biometric validation flow
        const biometricStates = {
          waiting: {
            title: 'Huella dactilar activa',
            desc: 'Toca el sensor de huella de tu móvil para continuar construyendo tus hábitos hoy.',
            badge: '+25 XP listos',
            orbIcon: 'fingerprint',
            orbSublabel: 'Toca el sensor',
            orbBg: 'bg-primary',
            orbTextColor: 'text-on-primary',
            ringOuterBg: 'bg-primary-fixed',
            ringMidBg: 'bg-surface-container-highest',
            primaryText: 'Desbloquear con huella',
            primaryIcon: 'fingerprint',
            primaryBg: 'bg-primary',
            primaryTextColor: 'text-on-primary',
            primaryShadow: 'shadow-primary/20',
            secondaryText: 'Usar PIN o patrón del sistema',
            secondaryVisible: true,
            ariaLive: 'polite',
          },
          canceled: {
            title: 'Desbloqueo pausado',
            desc: 'El sensor se ha detenido temporalmente. Cuando quieras entrar, pulsa el botón inferior.',
            badge: 'Esperando confirmación',
            orbIcon: 'pause_circle',
            orbSublabel: 'En pausa',
            orbBg: 'bg-surface-container-highest',
            orbTextColor: 'text-on-surface',
            ringOuterBg: 'bg-surface-container-low',
            ringMidBg: 'bg-surface-container',
            primaryText: 'Reactivar sensor de huella',
            primaryIcon: 'play_arrow',
            primaryBg: 'bg-primary',
            primaryTextColor: 'text-on-primary',
            primaryShadow: 'shadow-primary/20',
            secondaryText: 'Usar PIN o patrón del sistema',
            secondaryVisible: true,
            ariaLive: 'polite',
          },
          unrecognized: {
            title: 'Huella no reconocida',
            desc: 'No hemos podido verificar tu huella con precisión. Vuelve a colocar el dedo con calma y firmeza.',
            badge: 'Intento registrado',
            orbIcon: 'fingerprint_off',
            orbSublabel: 'Vuelve a probar',
            orbBg: 'bg-secondary-container',
            orbTextColor: 'text-on-secondary-container',
            ringOuterBg: 'bg-secondary-fixed',
            ringMidBg: 'bg-secondary-fixed-dim',
            primaryText: 'Reintentar huella dactilar',
            primaryIcon: 'refresh',
            primaryBg: 'bg-secondary-container',
            primaryTextColor: 'text-on-secondary-container',
            primaryShadow: 'shadow-secondary-container/30',
            secondaryText: 'Ingresar con clave del dispositivo',
            secondaryVisible: true,
            ariaLive: 'assertive',
          },
          locked: {
            title: 'Demasiados intentos',
            desc: 'Has probado varias veces seguidas sin éxito. Por seguridad, usa el PIN, patrón o contraseña de tu teléfono para acceder.',
            badge: 'Escudo reforzado',
            orbIcon: 'lock',
            orbSublabel: 'Sensor bloqueado',
            orbBg: 'bg-error',
            orbTextColor: 'text-on-error',
            ringOuterBg: 'bg-error-container',
            ringMidBg: 'bg-error-container',
            primaryText: 'Desbloquear con PIN del sistema',
            primaryIcon: 'lock_open',
            primaryBg: 'bg-error',
            primaryTextColor: 'text-on-error',
            primaryShadow: 'shadow-error/30',
            secondaryText: 'Información de seguridad',
            secondaryVisible: false,
            ariaLive: 'assertive',
          },
        };

        let currentStateKey = 'waiting';

        function setBiometricState(stateKey) {
          const config = biometricStates[stateKey];
          if (!config) return;
          currentStateKey = stateKey;

          // Update active tab buttons visual styling
          const tabs = {
            waiting: document.getElementById('tab-state-a'),
            canceled: document.getElementById('tab-state-b'),
            unrecognized: document.getElementById('tab-state-c'),
            locked: document.getElementById('tab-state-d'),
          };

          Object.keys(tabs).forEach((k) => {
            const tab = tabs[k];
            if (!tab) return;
            if (k === stateKey) {
              tab.setAttribute('aria-selected', 'true');
              tab.className =
                'state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-primary text-on-primary shadow-sm active:scale-97 transition-all text-center';
            } else {
              tab.setAttribute('aria-selected', 'false');
              tab.className =
                'state-pill-btn flex items-center justify-center gap-1.5 px-2.5 py-2 rounded-full font-label-md text-label-md bg-surface text-on-surface-variant shadow-sm active:scale-97 transition-all text-center';
            }
          });

          // Announcer attributes
          const announcer = document.getElementById('status-announcer');
          announcer.setAttribute('aria-live', config.ariaLive);

          // Text updates
          document.getElementById('feedback-title').textContent = config.title;
          document.getElementById('feedback-desc').textContent = config.desc;
          document.getElementById('orb-badge').querySelector('span:last-child').textContent =
            config.badge;
          document.getElementById('orb-icon').textContent = config.orbIcon;
          document.getElementById('orb-sublabel').textContent = config.orbSublabel;

          // Orb Colors & Pulsing
          const orb = document.getElementById('biometric-touch-target');
          orb.className = `relative z-10 flex flex-col items-center justify-center w-40 h-40 rounded-full ${config.orbBg} ${config.orbTextColor} shadow-xl active:scale-95 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-primary-fixed`;

          const ringOuter = document.getElementById('ring-outer');
          ringOuter.className = `absolute inset-0 rounded-full ${config.ringOuterBg} opacity-40 transition-all duration-700 pointer-events-none ${stateKey === 'waiting' ? 'animate-ping' : ''}`;

          const ringMid = document.getElementById('ring-mid');
          ringMid.className = `absolute inset-4 rounded-full ${config.ringMidBg} opacity-70 transition-all duration-500 pointer-events-none`;

          // Primary CTA Update
          const primaryBtn = document.getElementById('primary-action-btn');
          document.getElementById('primary-action-text').textContent = config.primaryText;
          document.getElementById('primary-action-icon').textContent = config.primaryIcon;
          primaryBtn.className = `w-full h-[52px] rounded-full ${config.primaryBg} ${config.primaryTextColor} font-label-lg text-label-lg shadow-lg ${config.primaryShadow} flex items-center justify-center gap-2 active:scale-97 transition-all duration-200`;

          // Secondary CTA
          const secondaryBtn = document.getElementById('secondary-action-btn');
          document.getElementById('secondary-action-text').textContent = config.secondaryText;
          if (config.secondaryVisible) {
            secondaryBtn.classList.remove('hidden');
          } else {
            secondaryBtn.classList.add('hidden');
          }

          // Playful haptic vibration (supported devices)
          if (navigator.vibrate) {
            if (stateKey === 'unrecognized') navigator.vibrate([40, 60, 40]);
            else if (stateKey === 'locked') navigator.vibrate([100, 50, 100]);
            else navigator.vibrate(25);
          }
        }

        function handleOrbTap() {
          if (currentStateKey === 'locked') {
            triggerSystemFallback();
            return;
          }

          // Visual pulse feedback on tap
          const orb = document.getElementById('biometric-touch-target');
          orb.classList.add('scale-105');
          setTimeout(() => orb.classList.remove('scale-105'), 180);

          // Simulate instant success demo if tapped while waiting
          if (currentStateKey === 'waiting') {
            const title = document.getElementById('feedback-title');
            const desc = document.getElementById('feedback-desc');
            const icon = document.getElementById('orb-icon');

            icon.textContent = 'check_circle';
            title.textContent = '¡Bienvenido de vuelta!';
            desc.textContent = 'Identidad confirmada. Sincronizando tus rachas...';

            const orbEl = document.getElementById('biometric-touch-target');
            orbEl.classList.remove('bg-primary');
            orbEl.classList.add('bg-tertiary');

            if (navigator.vibrate) navigator.vibrate([30, 40, 60]);

            setTimeout(() => {
              setBiometricState('waiting');
            }, 1600);
          } else {
            // Re-arm to waiting state
            setBiometricState('waiting');
          }
        }

        function triggerSystemFallback() {
          const desc = document.getElementById('feedback-desc');
          desc.textContent = 'Solicitando diálogo nativo de autenticación segura de Android...';
          if (navigator.vibrate) navigator.vibrate(30);

          setTimeout(() => {
            desc.textContent =
              'Introduce el código o patrón de desbloqueo configurado en tu teléfono.';
          }, 900);
        }

        // Dark/Light Theme Switcher for UX Designer exploration
        const themeBtn = document.getElementById('theme-toggle-btn');
        const themeIcon = document.getElementById('theme-toggle-icon');
        const themeLabel = document.getElementById('theme-toggle-label');
        const htmlEl = document.documentElement;

        themeBtn.addEventListener('click', () => {
          const isDark = htmlEl.classList.toggle('dark');
          if (isDark) {
            themeIcon.textContent = 'light_mode';
            themeLabel.textContent = 'Claro';
          } else {
            themeIcon.textContent = 'dark_mode';
            themeLabel.textContent = 'Oscuro';
          }
        });
      </script>
    </main>
  </body>
</html>
