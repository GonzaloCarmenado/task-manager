<app-account-header [title]="copy.title" (back)="goBack()" />

<form class="page" novalidate (submit)="onSubmit($event)">
  @if (offline()) {
  <app-offline-banner (retry)="submit()" />
  }

  <app-account-field
    [label]="copy.currentLabel"
    icon="lock"
    type="password"
    autocomplete="current-password"
    [placeholder]="shared.passwordPlaceholder"
    [toggleLabel]="shared.toggleLabel"
    [error]="currentError()"
    [value]="current()"
    (valueChange)="onCurrent($event)"
  />

  <app-account-field
    [label]="copy.newLabel"
    icon="key"
    type="password"
    autocomplete="new-password"
    [placeholder]="shared.passwordPlaceholder"
    [hint]="shared.passwordHint"
    [toggleLabel]="shared.toggleLabel"
    [rules]="newRules()"
    [error]="nextError()"
    [value]="next()"
    (valueChange)="onNext($event)"
    (blurred)="onBlur('next')"
  />

  <app-account-field
    [label]="copy.repeatLabel"
    icon="verified-user"
    type="password"
    autocomplete="new-password"
    [placeholder]="shared.passwordPlaceholder"
    [hint]="match().label"
    [hintTone]="match().state"
    [toggleLabel]="shared.toggleLabel"
    [rules]="repeatRules()"
    [error]="repeatError()"
    [value]="repeat()"
    (valueChange)="onRepeat($event)"
    (blurred)="onBlur('repeat')"
  />

  @if (formError(); as message) {
  <p class="form-error" role="alert">
    <app-icon name="alert-circle" />
    {{ message }}
  </p>
  }

  <div class="actions">
    <button
      class="submit"
      type="submit"
      [class.loading]="loading()"
      [disabled]="!canSubmit()"
      [attr.aria-busy]="loading()"
    >
      @if (loading()) {
      <span class="spinner" aria-hidden="true"></span>
      {{ copy.submitting }} } @else {
      <app-icon name="key" />
      {{ copy.submit }} }
    </button>
    <button class="cancel" type="button" (click)="goBack()">
      <app-icon name="x" />
      {{ copy.cancel }}
    </button>
  </div>
</form>
