# Spec 013: compila, firma y publica el APK de Android (arm64-v8a) en las Releases.
#
# - Se lanza al crear una etiqueta vX.Y.Z (o vX.Y.Z-sufijo, que se publica como versión previa) o a mano.
# - La etiqueta debe apuntar a un commit de main. La ejecución manual solo se admite desde main y NO publica:
#   sube el APK como artefacto del flujo.
# - Tres trabajos con permisos mínimos: verify (sin secretos), build (único que ve los secretos; solo lee el repo)
#   y publish (único que escribe en las Releases; no ve la clave de firma).
# - Los secretos solo van en `env:` de los pasos que los usan. Ver docs/release.md.
name: Release Android

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: El commit de la etiqueta debe estar en main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "La etiqueta no apunta a un commit de main: solo se publica código ya fusionado." >&2
            exit 1
          fi
      - name: Versión de la etiqueta y coherencia con el proyecto
        id: release
        run: node scripts/release-version.mjs resolve --event "$EVENT" --ref "$GITHUB_REF" --run-number "$RUN_NUMBER"
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Controles (los mismos que el pre-commit)
        run: |
          pnpm secrets:check
          pnpm lint
          pnpm type-check
          pnpm test:ci
          pnpm test:scripts

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Comprobar que existen todos los secretos
        run: node scripts/release-ci.mjs require SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Generar environment.ts desde los secretos
        run: node scripts/write-environment.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Herramientas de Android del ejecutor
        run: |
          # El ejecutor de GitHub trae el SDK y el NDK instalados: se usan en lugar de otra acción de terceros.
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Generar el proyecto de Android
        run: pnpm tauri android init --ci
      - name: Compilar el APK de release (arm64, sin firmar)
        run: pnpm tauri android build --apk --target aarch64 --config "$TAURI_CONFIG"
        env:
          TAURI_CONFIG: '{"version":"${{ needs.verify.outputs.version }}","bundle":{"android":{"versionCode":${{ needs.verify.outputs.version_code }}}}}'
      - name: Firmar y validar el APK
        run: |
          set -euo pipefail
          mapfile -t UNSIGNED < <(find src-tauri/gen/android/app/build/outputs -name '*release-unsigned.apk')
          if [ "${#UNSIGNED[@]}" -ne 1 ]; then
            echo "Se esperaba exactamente un APK de release sin firmar y hay ${#UNSIGNED[@]}." >&2
            exit 1
          fi
          OUT="task-manager-${VERSION}-arm64-v8a.apk"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/zipalign" -f -p 4 "${UNSIGNED[0]}" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$OUT")"
          grep -qF "package: name='com.polyp.taskmanager' versionCode='${VERSION_CODE}' versionName='${VERSION}'" <<< "$BADGING" \
            || { echo "El identificador, versionCode o versionName del APK no son los esperados." >&2; exit 1; }
          grep -qx "native-code: 'arm64-v8a'" <<< "$BADGING" \
            || { echo "El APK debe incluir solo la arquitectura arm64-v8a." >&2; exit 1; }
          if grep -q "application-debuggable" <<< "$BADGING"; then
            echo "El APK es depurable: no se publica." >&2
            exit 1
          fi
          sha256sum "$OUT" > "$OUT.sha256"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Borrar el keystore y environment.ts
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk" src/environments/environment.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: |
            task-manager-*-arm64-v8a.apk
            task-manager-*-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

  publish:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release-files
      - name: Crear o actualizar la Release
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${FLAGS[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
