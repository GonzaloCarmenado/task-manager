[package]
name = "tauri-plugin-app-settings"
version = "0.1.0"
description = "Plugin local de Android: abre los ajustes de notificaciones y de alarmas exactas y consulta si se pueden programar alarmas exactas."
edition = "2024"
rust-version = "1.90"
publish = false
links = "tauri-plugin-app-settings"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
